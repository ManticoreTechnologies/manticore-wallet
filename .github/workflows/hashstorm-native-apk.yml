name: Hashstorm native Android APK
on:
  push:
    branches:
      - hashstorm-apk-build-20261121
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
      - name: Restore native Android source
        run: |
          mkdir -p hashstorm-build/src
          base64 -d hashstorm-build/evrmore-hashstorm-native-android.zip.b64 > hashstorm-build/source.zip
          unzip -q hashstorm-build/source.zip -d hashstorm-build/src
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable Android APK
        working-directory: hashstorm-build/src/evrmore-hashstorm-android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Hashstorm-Android-APK
          path: hashstorm-build/src/evrmore-hashstorm-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
