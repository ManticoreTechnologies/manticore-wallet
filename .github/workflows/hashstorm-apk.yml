name: Build Hashstorm Android APK
on:
  push:
    branches: [hashstorm-apk-build-20261121]
    paths:
      - ".github/workflows/hashstorm-apk.yml"
      - "hashstorm-build/**"
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract project
        run: |
          base64 -d hashstorm-build/android-source.zip.b64 > /tmp/hashstorm.zip
          unzip -q /tmp/hashstorm.zip -d /tmp/hashstorm
      - name: Build native debug APK
        working-directory: /tmp/hashstorm/evrmore-hashstorm-android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hashstorm-installable-android-apk
          path: /tmp/hashstorm/evrmore-hashstorm-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
